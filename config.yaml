# VibeSolve - configuration file
#
# Usage:
#   vibesolve run --config config.yaml
#   vibesolve batch --config config.yaml
#
# Priority (highest → lowest):
#   1. CLI flags              (e.g. --provider=google)
#   2. Environment variables  (e.g. PROVIDER=google)
#   3. This YAML file
#   4. .env.local
#   5. Built-in defaults

# Pi provider. Aliases: claude -> anthropic, gemini -> google,
# bedrock -> amazon-bedrock. openai-codex requires a Pi login.
provider: openai

# Model and reasoning-effort overrides; use model IDs from Pi's catalog.
# Effort: auto | none | low | medium | high. `auto` omits the parameter.
# `run --reasoning-effort` overrides every agent's effort.
# Defaults: src/vibesolve/config/provider_models.json.
# `_default` sets model and/or effort for all agents in a provider block.
# Per-agent settings override `_default`, which overrides the bundled defaults.
provider_models: {}
# Example custom-provider override (replace the empty mapping above):
# provider_models:
#   amazon-bedrock:
#     _default:
#       model: amazon.nova-lite-v1:0
#       effort: none
#     reviewer:
#       model: amazon.nova-pro-v1:0
#     fixer:
#       model: amazon.nova-pro-v1:0
# All roles inherit effort: none; these Nova models do not support reasoning.

# --- General runtime settings ---

# Run Docker validation (mvn compile + mvn exec:java + mvn test) after generation.
enable_docker_validation: true

# Total repair attempts: the IO model first, then the fixer model.
max_fix_iterations: 2

# Default number of parallel workers for `vibesolve batch`.
default_workers: 3
