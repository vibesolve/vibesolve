# VibeSolve - configuration file
#
# Usage:
#   vibesolve run --config config.yaml
#   vibesolve batch --config config.yaml
#
# Priority (highest → lowest):
#   1. CLI flags              (e.g. --provider=bedrock, --reasoning-effort=high)
#   2. Environment variables  (e.g. PROVIDER=bedrock, PROVIDER_MODELS__BEDROCK__FIXER__MODEL=amazon.nova-pro-v1:0)
#   3. This YAML file
#   4. Built-in defaults

# any-llm provider name. The legacy value "claude" is accepted as an alias for
# any-llm's "anthropic" provider.
provider: openai

# Optional generic API key override for providers that accept one API key.
# If omitted, any-llm uses provider-native environment variables or credential
# chains such as AWS_PROFILE/AWS_REGION for Bedrock.
# api_key:

# Per-provider model and reasoning-effort overrides. Provider names are any-llm
# names after compatibility aliases are applied (`claude` -> `anthropic`).
# Allowed effort values per agent: none | low | medium | high. Override every
# agent at once from the CLI with --reasoning-effort.
# An optional `_default` key in a provider block sets the model and/or effort for
# every agent at once (see the deepseek block below); per-agent entries override
# it. Precedence: per-agent value > _default > built-in default.
provider_models:
  # Every agent uses gpt-5-mini; only the reviewer and fixer raise their effort.
  openai:
    _default:
      model: gpt-5-mini
      effort: none
    reviewer:
      effort: medium
    fixer:
      effort: high
  anthropic:
    parser:
      model: claude-haiku-4-5-20251001
      effort: none
    model_builder:
      model: claude-haiku-4-5-20251001
      effort: none
    constraint_builder:
      model: claude-haiku-4-5-20251001
      effort: none
    io:
      model: claude-haiku-4-5-20251001
      effort: none
    integrator:
      model: claude-haiku-4-5-20251001
      effort: none
    reviewer:
      model: claude-sonnet-4-6
      effort: medium
    fixer:
      model: claude-sonnet-4-6
      effort: high
    user_validator_explain:
      model: claude-haiku-4-5-20251001
      effort: none
    user_validator_update:
      model: claude-haiku-4-5-20251001
      effort: none
  # The optional `_default` key sets the model and/or effort for every agent in
  # the block; per-agent entries below it override individual agents. Precedence:
  # per-agent value > _default > built-in default.
  #
  # DeepSeek V4 controls reasoning via the reasoning_effort parameter on the same
  # model (see api-docs.deepseek.com/guides/thinking_mode) — there is no separate
  # reasoner model. Thinking defaults to ENABLED and low/medium are mapped to high,
  # so effort here is effectively high for every agent. Fully disabling thinking
  # requires extra_body={"thinking": {"type": "disabled"}}, which the current
  # caller does not send, so all agents run in thinking mode.
  # Credentials: a real DEEPSEEK_API_KEY env var (a .env.local entry is NOT
  # exported to any-llm) or the generic api_key override.
  deepseek:
    _default:
      model: deepseek-v4-flash
      effort: high
