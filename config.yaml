# VibeSolve - configuration file
#
# Usage:
#   vibesolve run --config config.yaml
#   vibesolve batch --config config.yaml
#
# Priority (highest → lowest):
#   1. CLI flags              (e.g. --provider=bedrock, --reasoning-effort=high)
#   2. Environment variables  (e.g. PROVIDER=bedrock, PROVIDER_MODELS__BEDROCK___DEFAULT__MODEL=amazon.nova-lite-v1:0)
#   3. This YAML file
#   4. Built-in defaults

# any-llm provider name. The legacy value "claude" is accepted as an alias for
# any-llm's "anthropic" provider.
provider: openai

# Per-provider model and reasoning-effort overrides. Provider names are any-llm
# names after compatibility aliases are applied (`claude` -> `anthropic`).
# Allowed effort values per agent: auto | none | low | medium | high. `auto`
# omits the reasoning parameter so the provider/model chooses.
# Override every agent at once from the CLI with --reasoning-effort.
# Built-in profiles are shipped in src/vibesolve/config/provider_models.json so
# they also work from an installed wheel. This mapping is only for user
# overrides and custom providers. An optional `_default` sets the model and/or
# effort for every agent in a provider block; per-agent entries override it.
# Precedence: per-agent value > _default > packaged profile.
provider_models: {}
# Example custom-provider override (replace the empty mapping above):
# provider_models:
#   bedrock:
#     _default:
#       model: amazon.nova-lite-v1:0
#       effort: none
#     reviewer:
#       model: amazon.nova-pro-v1:0
#       effort: medium
#     fixer:
#       model: amazon.nova-pro-v1:0
#       effort: high

# --- General runtime settings ---

# Reserved for provider caching support. The unified any-llm completion path
# does not currently attach provider-specific cache flags.
enable_caching: true

# Run Docker validation (mvn compile + mvn exec:java) after generation.
enable_docker_validation: true

# Maximum number of Fixer agent iterations per problem before giving up.
max_fix_iterations: 10

# Default number of parallel workers for `vibesolve batch`.
default_workers: 3
