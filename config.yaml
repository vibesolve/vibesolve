# VibeSolve - configuration file
#
# Usage:
#   vibesolve run --config config.yaml
#   vibesolve batch --config config.yaml
#
# Priority (highest → lowest):
#   1. CLI flags              (e.g. --provider=bedrock, --reasoning-effort=high)
#   2. Environment variables  (e.g. PROVIDER=bedrock, MODELS__FIXER=gpt-5)
#   3. This YAML file
#   4. Built-in defaults

# any-llm provider name. The legacy value "claude" is accepted as an alias for
# any-llm's "anthropic" provider.
provider: openai

# Optional generic API key override for providers that accept one API key.
# If omitted, any-llm uses provider-native environment variables or credential
# chains such as AWS_PROFILE/AWS_REGION for Bedrock.
# api_key:

# Per-agent reasoning effort (applies to whichever any-llm provider is active).
# Allowed values per agent: none | low | medium | high
# Override every agent at once from the CLI with --reasoning-effort.
efforts:
  parser:                  none
  model_builder:           none
  constraint_builder:      none
  io:                      none
  integrator:              none
  reviewer:                medium
  fixer:                   high
  user_validator_explain:  none
  user_validator_update:   none

# Per-agent model overrides for the active provider. These defaults are OpenAI
# model IDs because provider defaults to openai.
models:
  parser:                  gpt-5-mini
  model_builder:           gpt-5-mini
  constraint_builder:      gpt-5-mini
  io:                      gpt-5-mini
  integrator:              gpt-5-mini
  reviewer:                gpt-5-mini
  fixer:                   gpt-5-mini
  user_validator_explain:  gpt-5-mini
  user_validator_update:   gpt-5-mini

# Compatibility model overrides for provider=claude or provider=anthropic.
claude_models:
  parser:             claude-haiku-4-5-20251001
  model_builder:      claude-haiku-4-5-20251001
  constraint_builder: claude-haiku-4-5-20251001
  io:                 claude-haiku-4-5-20251001
  integrator:         claude-haiku-4-5-20251001
  reviewer:           claude-sonnet-4-6
  fixer:              claude-sonnet-4-6
  user_validator_explain:  claude-haiku-4-5-20251001
  user_validator_update:   claude-haiku-4-5-20251001

# Optional per-provider model overrides for any any-llm provider. If an entry
# exists for the active provider, it wins over models/claude_models.
# Provider names are any-llm names after compatibility aliases are applied.
# provider_models:
#   bedrock:
#     parser:                  amazon.nova-lite-v1:0
#     model_builder:           amazon.nova-lite-v1:0
#     constraint_builder:      amazon.nova-lite-v1:0
#     io:                      amazon.nova-lite-v1:0
#     integrator:              amazon.nova-lite-v1:0
#     reviewer:                amazon.nova-pro-v1:0
#     fixer:                   amazon.nova-pro-v1:0
#     user_validator_explain:  amazon.nova-lite-v1:0
#     user_validator_update:   amazon.nova-lite-v1:0

# --- General runtime settings ---

# Reserved for provider caching support. The unified any-llm completion path
# does not currently attach provider-specific cache flags.
enable_caching: true

# Run Docker validation (mvn compile + mvn exec:java) after generation.
enable_docker_validation: true

# Maximum number of Fixer agent iterations per problem before giving up.
max_fix_iterations: 10

# Default number of parallel workers for vibesolve batch.
default_workers: 3
