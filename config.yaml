# OpenRouter - place API key in .env.local under API_KEY=
# Any model slug ending in :free works here; free models change frequently,
# so verify the slug at openrouter.ai/models?q=free before using.
# Run with: vibesolve run --provider openrouter
#  openrouter:
#    _default:
#      model: nvidia/nemotron-3-ultra-550b-a55b:free
#      effort: none

# --- General runtime settings ---

# Reserved for provider caching support. The unified any-llm completion path
# does not currently attach provider-specific cache flags.
enable_caching: true

# Run Docker validation (mvn compile + mvn exec:java) after generation.
enable_docker_validation: true

# Maximum number of Fixer agent iterations per problem before giving up.
max_fix_iterations: 10

# Default number of parallel workers for vibesolve batch.
default_workers: 3
