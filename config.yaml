# VibeSolve - configuration file
#
# Usage:
#   vibesolve run --config config.yaml
#   vibesolve batch --config config.yaml
#
# Priority (highest → lowest):
#   1. CLI flags              (e.g. --provider=claude, --reasoning-effort=high)
#   2. Environment variables  (e.g. PROVIDER=claude, PROVIDER_MODELS__ANTHROPIC__FIXER__MODEL=claude-sonnet-4-6)
#   3. This YAML file
#   4. Built-in defaults

# LLM provider compatibility name: openai | claude.
# Internally, claude is routed through any-llm's anthropic provider.
provider: openai

# Per-provider model and reasoning-effort overrides. The built-in profiles are
# keyed as openai and anthropic (`claude` selects the anthropic profile).
# Allowed effort values per agent: none | low | medium | high. Override every
# agent at once from the CLI with --reasoning-effort.
# An optional `_default` key in a provider block sets the model and/or effort for
# every agent at once; per-agent entries override it. Precedence: per-agent value
# > _default > built-in default.
provider_models: {}
#   openai:
#     _default:
#       model: gpt-5-mini
#       effort: none
#     reviewer:
#       effort: medium
#     fixer:
#       effort: high

# --- General runtime settings ---

# Reserved for provider caching support. The unified any-llm completion path
# does not currently attach provider-specific cache flags.
enable_caching: true

# Run Docker validation (mvn compile + mvn exec:java) after generation.
enable_docker_validation: true

# Maximum number of Fixer agent iterations per problem before giving up.
max_fix_iterations: 10

# Default number of parallel workers for `vibesolve batch`.
default_workers: 3
