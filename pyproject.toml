[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesolve"
version = "0.1.0"
description = "Generate complete Timefold Solver projects from plain-English problem descriptions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VibeSolve", email = "hello@vibesolve.ai" }]
keywords = ["timefold", "constraint-solver", "optimization", "llm", "code-generation"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "openai>=2.16.0",
    "anthropic>=0.50.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.2.1",
    "structlog>=24.4",
    "typer>=0.15",
    "httpx>=0.28.1",
    "pyyaml>=6.0",
    "json-repair>=0.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vibesolve = "vibesolve.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vibesolve" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
