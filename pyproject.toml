[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesolve"
version = "0.1.0"
description = "Generate complete Timefold Solver projects from plain-English problem descriptions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VibeSolve", email = "hello@vibesolve.ai" }]
keywords = ["timefold", "constraint-solver", "optimization", "llm", "code-generation"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "any-llm-sdk==1.26.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.1",
    "structlog>=24.4",
    "typer>=0.27.1",
    "uv==0.12.7",
    "httpx>=0.28.1",
    "pyyaml>=6.0",
    "json-repair>=0.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[dependency-groups]
provider-lock = [
    "any-llm-sdk[all]",
]

[project.scripts]
vibesolve = "vibesolve.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vibesolve" = ["prompts/*.txt"]

[tool.setuptools.data-files]
"share/vibesolve/provider-lock" = ["pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
